name: Orbit
options:
  bundleIdPrefix: io.github.dklingbeil
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  OrbitKit:
    path: Packages/OrbitKit

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES

targets:
  Orbit:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Orbit
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSAppleEventsUsageDescription: Orbit reads the Finder selection for its keyboard shortcut, and asks Pages, Keynote and Numbers to export documents.
        NSHumanReadableCopyright: © 2026 Orbit contributors. Released under the MIT License.
        NSServices:
          - NSMenuItem:
              default: Open in Orbit
            NSMessage: openWheel
            NSPortName: Orbit
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
    entitlements:
      path: App/Orbit.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dklingbeil.Orbit
        PRODUCT_NAME: Orbit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Bundle FFmpeg
        basedOnDependencyAnalysis: false
        script: |
          # Copies a static ffmpeg from Vendor/ffmpeg (see scripts/fetch-ffmpeg.sh) into the app.
          SRC="${SRCROOT}/Vendor/ffmpeg/ffmpeg"
          if [ -x "$SRC" ]; then
            DEST="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/ffmpeg"
            cp -f "$SRC" "$DEST"
            codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST"
            echo "Bundled ffmpeg from $SRC"
          else
            echo "note: Vendor/ffmpeg/ffmpeg not found; Orbit will use an ffmpeg from Homebrew or PATH."
          fi
