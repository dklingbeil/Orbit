name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install xcodegen ffmpeg webp
      - name: Engine unit tests
        run: swift test --package-path Packages/OrbitKit
      - name: Conversion smoke test
        shell: bash  # bash with pipefail, so failures aren't masked by tee
        run: scripts/smoke-test.sh "$RUNNER_TEMP/smoke" 2>&1 | tee smoke.log
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: ignore
      - name: Build app
        run: make build
