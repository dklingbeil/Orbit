name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen ffmpeg webp
      - name: Engine unit tests
        run: swift test --package-path Packages/OrbitKit
      - name: Conversion smoke test
        run: scripts/smoke-test.sh
      - name: Build app
        run: make build
